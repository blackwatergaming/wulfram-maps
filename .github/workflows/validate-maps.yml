name: Validate maps

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-maps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate maps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed map sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wulfram-maps
          persist-credentials: false

      - name: Check out the pinned map compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackwatergaming/wulfram-mapeditor
          ref: ff0ab21212e127e49326216a9c78f633bee4dfbd
          path: wulfram-mapeditor
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: wulfram-mapeditor/package-lock.json

      - name: Install compiler dependencies
        working-directory: wulfram-mapeditor
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile every canonical map
        working-directory: wulfram-mapeditor
        run: npm run maps:compile -- --all --repo ../wulfram-maps --out "$RUNNER_TEMP/compiled-maps"
