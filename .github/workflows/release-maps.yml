name: Release maps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release maps
    uses: ./.github/workflows/validate-maps.yml

  release:
    name: Publish validated maps
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wulfram-maps
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag belongs to main
        working-directory: wulfram-maps
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Check out the pinned map compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackwatergaming/wulfram-mapeditor
          ref: da7663e897a5cb6e965b3637fd06870dbaac9096 # v0.6.0
          path: wulfram-mapeditor
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: wulfram-mapeditor/package-lock.json

      - name: Install compiler dependencies
        working-directory: wulfram-mapeditor
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build validated release artifacts
        working-directory: wulfram-maps
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:build -- "$RELEASE_TAG" "$RUNNER_TEMP/release"

      - name: Publish GitHub Release
        working-directory: wulfram-maps
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/release/SHA256SUMS.txt"
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Wulfram maps $RELEASE_TAG" --generate-notes
